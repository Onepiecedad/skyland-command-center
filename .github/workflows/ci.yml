name: CI

# Kör alla enhets-/integrationstester automatiskt vid varje push och pull request.
# Två jobb (backend + frontend) körs parallellt. E2E (Playwright) ingår INTE här —
# det kräver en körande app + operatörslösenord och läggs till som ett separat steg.
#
# Frontend bygger OCKSÅ, inte bara testar. Skälet: 17 sep stod main med grönt CI
# medan `npm run build` föll på fem typfel i två testfiler. Docker-bygget kör samma
# kommando, så frontend-deployen hade i tysthet stått stilla. Gröna tester som inte
# vet om att bygget är rött är värre än inga tester, för de inger falsk trygghet.

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend-tester
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend-tester
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
